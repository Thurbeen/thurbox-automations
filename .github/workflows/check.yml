# The gate on every pull request: lint, the pane's tests against the pinned
# thurbox interface, and the plugin installed and loaded the way the README
# says — on Linux, and with native thurbox on Windows.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The thurbox release the pane is tested against. One place, because the
# binary and the `ui/` tree the tests load have to be the same version.
env:
  THURBOX_TAG: v2.56.5

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Thurbeen/thurbox
          ref: ${{ env.THURBOX_TAG }}
          path: .cache/thurbox
          sparse-checkout: |
            ui
            thurbox.yml
          sparse-checkout-cone-mode: false
      - name: Install gate tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq lua5.4
          mkdir -p "$RUNNER_TEMP/tools"
          fetch() {
            curl -fsSL "$1" -o "$RUNNER_TEMP/tools/$2"
            echo "$3  $RUNNER_TEMP/tools/$2" | sha256sum -c -
          }
          fetch "https://github.com/Thurbeen/thurbox/releases/download/${THURBOX_TAG}/thurbox-${THURBOX_TAG}-x86_64-unknown-linux-gnu.tar.gz" thurbox.tar.gz 62b4bf9a4e3d88f752228d100f795b20a318420074b2ae2254512dd397dc35ec
          tar -xzf "$RUNNER_TEMP/tools/thurbox.tar.gz" -C "$RUNNER_TEMP/tools"
          fetch https://github.com/JohnnyMorganz/StyLua/releases/download/v2.5.2/stylua-linux-x86_64.zip stylua.zip bcb0d855e91f102f28a370e850f8566b3b44b79e6274d806ea5246837c0fd5ab
          unzip -q "$RUNNER_TEMP/tools/stylua.zip" -d "$RUNNER_TEMP/tools"
          fetch https://github.com/Kampfkarren/selene/releases/download/0.32.0/selene-0.32.0-linux.zip selene.zip d3773393578580074386e69337d35b7acddfbaa9fc38964c07fa3e28436ade9b
          unzip -q "$RUNNER_TEMP/tools/selene.zip" -d "$RUNNER_TEMP/tools"
          fetch https://github.com/rvben/rumdl/releases/download/v0.2.78/rumdl-v0.2.78-x86_64-unknown-linux-gnu.tar.gz rumdl.tar.gz 5597ecab62c6cd50e63f85451fe4e763abc58195a3e7eff9186b6dfae890ca24
          tar -xzf "$RUNNER_TEMP/tools/rumdl.tar.gz" -C "$RUNNER_TEMP/tools"
          chmod +x "$RUNNER_TEMP/tools/"{selene,stylua,rumdl}
          find "$RUNNER_TEMP/tools" -name thurbox-cli -exec dirname {} \; | head -1 >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      # The vendored copy is what a local `selene` reads. Failing when it has
      # drifted from the tag says "refresh it" rather than linting against a
      # sandbox that is no longer the real one.
      - name: The sandbox contract matches the pinned tag
        run: diff -u .cache/thurbox/thurbox.yml thurbox.yml
      - name: Gate
        env:
          THURBOX_REPO: .cache/thurbox
          LUA: lua5.4
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          bash scripts/check.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native thurbox
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP/thurbox.zip"
          Invoke-WebRequest "https://github.com/Thurbeen/thurbox/releases/download/$env:THURBOX_TAG/thurbox-$env:THURBOX_TAG-x86_64-pc-windows-msvc.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne '05334248e1aaaa8d2bfe720ad748fd5852636f56ed2b5d88f8ec473fcd428656') { throw 'checksum mismatch' }
          Expand-Archive $archive "$env:RUNNER_TEMP/thurbox"
          $cli = Get-ChildItem "$env:RUNNER_TEMP/thurbox" -Recurse -Filter thurbox-cli.exe | Select-Object -First 1
          $cli.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append
      # Installed as the README says, into a profile made for the purpose: the
      # interface, config and data directories all point under RUNNER_TEMP.
      - name: Install and load it
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP/loads"
          New-Item -ItemType Directory -Force "$root/config", "$root/data" | Out-Null
          git clone --quiet "$env:GITHUB_WORKSPACE" "$root/thurbox-automations"
          $env:THURBOX_CONFIG_DIR = "$root/config"
          $env:THURBOX_DATA_DIR = "$root/data"
          $source = "git+file:///" + ("$root/thurbox-automations" -replace '\\', '/')
          thurbox-cli plugin install $source --text
          if ($LASTEXITCODE -ne 0) { throw 'install failed' }
          thurbox-cli plugin check --text
          if ($LASTEXITCODE -ne 0) { throw 'check failed' }
          $check = thurbox-cli plugin check --json | ConvertFrom-Json
          if (-not $check.ok) { throw 'not ok' }
          if ($check.loaded -notcontains 'automations') { throw 'automations did not load' }
          if ($check.warnings.Count -gt 0) { throw ($check.warnings | ConvertTo-Json) }
