# Run with prek (`prek install`), the same hooks the gate runs.
repos:
  - repo: local
    hooks:
      - id: stylua
        name: stylua
        entry: stylua --check
        language: system
        types: [lua]
      - id: selene
        name: selene
        entry: selene
        language: system
        types: [lua]
        exclude: ^tests/
      - id: rumdl
        name: rumdl
        entry: rumdl check
        language: system
        types: [markdown]
